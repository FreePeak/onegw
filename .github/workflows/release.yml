name: release

# Semantic versioning from conventional commits on master:
#   breaking (feat!/fix!:/BREAKING CHANGE:) -> major
#   feat -> minor
#   fix/perf -> patch
# Other commit types (ci:, docs:, chore:, ...) never release.
# Bootstrap: when no tag exists yet, the first master push cuts v0.1.0.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        name: Compute next semantic version
        env:
          FIRST_TAG: v0.1.0
        run: |
          set -euo pipefail
          # The base version is the HIGHEST tag that exists anywhere, NOT the
          # highest tag reachable from HEAD. `git describe` only walks ancestors:
          # when a tag is cut on a line that is later reset off master, it stops
          # being reachable, `git describe` silently falls back to an older tag,
          # and the calc re-derives a number that was already released — every
          # push then recomputes the SAME tag (v0.43.5 while v0.44.0 was the
          # latest release), the Push tag step no-ops by design, and the release
          # job dies on "a release with the same tag name already exists".
          last="$(git tag -l 'v[0-9]*' --sort=-v:refname | sed -n '1p')"
          if [ -z "$last" ]; then
            range="HEAD"
            major=0; minor=0; patch=0
          else
            range="$last..HEAD"
            ver="${last#v}"
            IFS=. read -r major minor patch <<< "$ver"
          fi

          # Bump policy (matches this repo's free-form history: typeless and
          # non-CC types like "dashboard:", "saver:", "security:" carry real
          # work, so anything except docs/test/chore/ci bumps at least patch):
          #   BREAKING CHANGE: / type!  -> major
          #   feat                      -> minor
          #   fix, perf                 -> patch
          #   anything else except docs/test/chore/ci -> patch
          # Type detection reads commit SUBJECTS (%s) — body lines must not
          # match (a multi-line ci: commit body would otherwise bump patch).
          # Full bodies are scanned only for BREAKING CHANGE:. Merge commits
          # are excluded (their subjects aren't work).
          msgs="$(git log $range --no-merges --pretty=%s)"
          breaking="$(git log $range --no-merges --pretty=%B | grep -c 'BREAKING CHANGE:' || true)"
          bump=""
          if printf '%s\n' "$msgs" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
            || [ "$breaking" -gt 0 ]; then
            bump=major
          elif printf '%s\n' "$msgs" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$msgs" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          elif printf '%s\n' "$msgs" | awk 'NF && $0 !~ /^(docs|test|chore|ci)(\([^)]*\))?:/ {found=1} END {exit !found}'; then
            bump=patch
          fi

          # First release ever: cut it regardless of the leading commit type.
          if [ -z "$last" ] && [ -z "$bump" ]; then
            echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"
            echo "bootstrap release: $FIRST_TAG"
            exit 0
          fi

          if [ -z "$bump" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no release-worthy commits since ${last:-beginning}; skipping"
            exit 0
          fi

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          tag="v$major.$minor.$patch"
          # Belt and braces: whatever the base was, never hand a tag that
          # already exists to the release job (it dies on "already exists").
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            patch=$((patch+1))
            tag="v$major.$minor.$patch"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next tag: $tag ($bump)"

      - name: Push tag
        if: steps.calc.outputs.tag != ''
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          if git tag "${{ steps.calc.outputs.tag }}" 2>/dev/null || git ls-remote origin "refs/tags/${{ steps.calc.outputs.tag }}" | grep -q .; then
            echo "tag ${{ steps.calc.outputs.tag }} already exists - reusing it"
          else
            git tag "${{ steps.calc.outputs.tag }}" 2>/dev/null || true
            git push origin "${{ steps.calc.outputs.tag }}" 2>/dev/null || \
              { echo "tag ${{ steps.calc.outputs.tag }} already exists on remote - reusing it"; git tag -d "${{ steps.calc.outputs.tag }}" || true; }
          fi

  assets:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X onegw/internal/update.version=${{ needs.version.outputs.tag }}" -o "dist/onegw-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/onegw
      - uses: actions/upload-artifact@v4
        with:
          name: onegw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: [version, assets]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum onegw-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*

  docker:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Probe whether this repo may write the package
        id: writable
        # A GITHUB_TOKEN push is authorised PER PACKAGE, not per repo. The
        # package ghcr.io/freepeak/onegw was created by the OLD repo
        # FreePeak/onegw-private, so this repo's push is rejected with
        # write_package no matter what `permissions:` or the org default say,
        # and no API can re-link it. One upload-session probe (202 = this repo
        # may write, 403 = owner-gated) tells the two apart up front: it stops a
        # multi-arch build being spent on a push that provably cannot land, and
        # it lets the push itself stay a hard failure on the writable path.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tok="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:freepeak/onegw:push,pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $tok" \
            "https://ghcr.io/v2/freepeak/onegw/blobs/uploads/")"
          echo "GHCR push probe for freepeak/onegw: HTTP $code"
          if [ "$code" = 202 ]; then
            echo "writable=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 403 ]; then
            echo "writable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unexpected GHCR push-probe response $code"; exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.writable.outputs.writable ***REMOVED*** 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.writable.outputs.writable ***REMOVED*** 'true'
      - uses: docker/login-action@v3
        if: steps.writable.outputs.writable ***REMOVED*** 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        if: steps.writable.outputs.writable ***REMOVED*** 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/freepeak/onegw:latest
            ghcr.io/freepeak/onegw:${{ needs.version.outputs.tag }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image is actually pullable
        # `build-push-action` reports success once the manifest is written, which
        # is not the same as the tags being readable: a package this repo cannot
        # write to fails at push (write_package), and a package whose linkage is
        # wrong can accept a push and still 404 the tag. Resolve both tags from
        # the registry as an anonymous client would — that is what fails the job
        # instead of shipping an image nobody can pull. When the package is
        # owner-gated there was nothing to publish, so the missing tags become an
        # annotation plus a job summary rather than a red job: a permission only
        # the owner can grant must not block a release. Every other failure —
        # including a package we CAN write to whose tag is not pullable — still
        # fails the job.
        env:
          WRITABLE: ${{ steps.writable.outputs.writable }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:freepeak/onegw:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          # One retry per ref: GHCR has failed a blob fetch mid-pull while the rest
          # of the manifest resolved fine, so a single flaky response is not proof
          # the image is unreachable.
          missing=""
          for ref in "$tag" latest; do
            code=""
            for _ in 1 2; do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json' \
                "https://ghcr.io/v2/freepeak/onegw/manifests/$ref")"
              if [ "$code" = 200 ]; then break; fi
              sleep 5
            done
            echo "ghcr.io/freepeak/onegw:$ref -> HTTP $code"
            if [ "$code" != 200 ]; then
              if [ "${WRITABLE:-false}" = true ]; then
                # We CAN write the package, so a tag the registry will not
                # resolve is a real publishing bug, not the owner-gated block.
                echo "::error::ghcr.io/freepeak/onegw:$ref is not pullable ($code) although this repo may push to the package — the push reported success but the tag is not readable. See docs/PRD.md."
                exit 1
              fi
              missing="$missing $ref"
            fi
          done
          # Not writable + nothing missing = the tags are already published (a
          # previous run, or the old repo): nothing to report, just pass.
          if [ "${WRITABLE:-false}" != true ] && [ -n "$missing" ]; then
            {
              echo "### docker image NOT published — owner-gated GHCR package"
              echo
              echo "\`ghcr.io/freepeak/onegw\` was not published (missing:${missing})."
              echo "The tag, the four binaries and the GitHub release were published normally."
              echo
              echo "A \`GITHUB_TOKEN\` push is authorised per PACKAGE: \`freepeak/onegw\` was"
              echo "created by the old repo \`FreePeak/onegw-private\`, so \`packages: write\` and"
              echo "the org default of \"read and write\" are not enough, and no API can re-link it."
              echo "This job passes deliberately, so a permission only the owner can grant cannot"
              echo "block a release; the annotation stays until the linkage is fixed."
              echo
              echo "**Fix (owner, Settings UI only):** package \`onegw\` → Settings → Manage"
              echo "Actions access → add \`FreePeak/onegw\` with **Write**, then re-run this"
              echo "workflow — it re-pushes both tags for the tag this run already created."
              echo "See \`docs/PRD.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=docker image NOT published::ghcr.io/freepeak/onegw was not published (missing:${missing}) — the package is linked to FreePeak/onegw-private. Package onegw → Settings → Manage Actions access → add FreePeak/onegw with Write, then re-run this workflow. See docs/PRD.md."
          fi
