name: release

# Semantic versioning from conventional commits on master:
#   breaking (feat!/fix!:/BREAKING CHANGE:) -> major
#   feat -> minor
#   fix/perf -> patch
# Other commit types (ci:, docs:, chore:, ...) never release.
# Bootstrap: when no tag exists yet, the first master push cuts v0.1.0.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        name: Compute next semantic version
        env:
          FIRST_TAG: v0.1.0
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$last" ]; then
            range="HEAD"
            major=0; minor=0; patch=0
          else
            range="$last..HEAD"
            ver="${last#v}"
            IFS=. read -r major minor patch <<< "$ver"
          fi

          # Bump policy (matches this repo's free-form history: typeless and
          # non-CC types like "dashboard:", "saver:", "security:" carry real
          # work, so anything except docs/test/chore/ci bumps at least patch):
          #   BREAKING CHANGE: / type!  -> major
          #   feat                      -> minor
          #   fix, perf                 -> patch
          #   anything else except docs/test/chore/ci -> patch
          # Type detection reads commit SUBJECTS (%s) — body lines must not
          # match (a multi-line ci: commit body would otherwise bump patch).
          # Full bodies are scanned only for BREAKING CHANGE:. Merge commits
          # are excluded (their subjects aren't work).
          msgs="$(git log $range --no-merges --pretty=%s)"
          breaking="$(git log $range --no-merges --pretty=%B | grep -c 'BREAKING CHANGE:' || true)"
          bump=""
          if printf '%s\n' "$msgs" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
            || [ "$breaking" -gt 0 ]; then
            bump=major
          elif printf '%s\n' "$msgs" | grep -Eq '^feat(\([^)]*\))?:'; then
            bump=minor
          elif printf '%s\n' "$msgs" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then
            bump=patch
          elif printf '%s\n' "$msgs" | awk 'NF && $0 !~ /^(docs|test|chore|ci)(\([^)]*\))?:/ {found=1} END {exit !found}'; then
            bump=patch
          fi

          # First release ever: cut it regardless of the leading commit type.
          if [ -z "$last" ] && [ -z "$bump" ]; then
            echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"
            echo "bootstrap release: $FIRST_TAG"
            exit 0
          fi

          if [ -z "$bump" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no release-worthy commits since ${last:-beginning}; skipping"
            exit 0
          fi

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next tag: $tag ($bump)"

      - name: Push tag
        if: steps.calc.outputs.tag != ''
        run: |
          if git tag "${{ steps.calc.outputs.tag }}" 2>/dev/null; then
            echo "tag ${{ steps.calc.outputs.tag }} already exists - reusing it"
          else
            git tag "${{ steps.calc.outputs.tag }}"
            git push origin "${{ steps.calc.outputs.tag }}"
          fi

  assets:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X onegw/internal/update.version=${{ needs.version.outputs.tag }}" -o "dist/onegw-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/onegw
      - uses: actions/upload-artifact@v4
        with:
          name: onegw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: [version, assets]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum onegw-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/*

  docker:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/freepeak/onegw:latest
            ghcr.io/freepeak/onegw:${{ needs.version.outputs.tag }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image is actually pullable
        # `build-push-action` reports success once the manifest is written, which
        # is not the same as the tags being readable: a package this repo cannot
        # write to fails at push (write_package), and a package whose linkage is
        # wrong can accept a push and still 404 the tag. Resolve both tags from
        # the registry as an anonymous client would — that is what fails the job
        # instead of shipping an image nobody can pull.
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:freepeak/onegw:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          # One retry per ref: GHCR has failed a blob fetch mid-pull while the rest
          # of the manifest resolved fine, so a single flaky response is not proof
          # the image is unreachable.
          for ref in "$tag" latest; do
            code=""
            for _ in 1 2; do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json' \
                "https://ghcr.io/v2/freepeak/onegw/manifests/$ref")"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "ghcr.io/freepeak/onegw:$ref -> HTTP $code"
            [ "$code" = 200 ] || \
              { echo "::error::ghcr.io/freepeak/onegw:$ref is not pullable ($code) — the package is not linked to this repo (Package onegw → Settings → Manage Actions access → add FreePeak/onegw with Write). See docs/PRD.md."; exit 1; }
          done
