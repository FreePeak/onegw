<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="onegw logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1E293B" stroke-width="2"/>

  <g stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M256 256 L256 118" stroke="#2DD4BF"/>
    <path d="M256 256 L125 331" stroke="#F59E0B"/>
    <path d="M256 256 L387 331" stroke="#3B82F6"/>
  </g>

  <!-- outward arrowheads on spokes -->
  <g>
    <path d="M256 100 L242 124 L270 124 Z" fill="#2DD4BF"/>
    <path d="M119 333 L139 305 L156 334 Z" fill="#F59E0B"/>
    <path d="M393 333 L356 334 L373 305 Z" fill="#3B82F6"/>
  </g>

  <!-- provider nodes -->
  <circle cx="256" cy="96"  r="34" fill="#10B981"/>
  <circle cx="118" cy="334" r="34" fill="#F59E0B"/>
  <circle cx="394" cy="334" r="34" fill="#3B82F6"/>

  <!-- central hub -->
  <circle cx="256" cy="256" r="86" fill="url(#hub)"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="#0B1220" stroke-width="10"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#0B1220" stroke-opacity="0.55" stroke-width="8"/>
  <g fill="#22D3EE">
    <path d="M233 232 L256 245 L279 232 L279 252 L256 265 L233 252 Z" fill-opacity="0.95"/>
    <path d="M233 264 L256 277 L279 264 L279 284 L256 297 L233 284 Z" fill-opacity="0.95"/>
  </g>
</svg>
