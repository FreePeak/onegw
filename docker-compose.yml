# onegw on a VPS: `docker compose up -d`
services:
  onegw:
    image: ghcr.io/freepeak/onegw:latest
    # build: .                 # uncomment to build from this directory instead
    restart: unless-stopped
    ports:
      - "8080:8080"           # LAN/public; use "127.0.0.1:8080:8080" to keep it loopback-only
    environment:
      ONEGW_KEYS: "change-me-gateway-key"      # clients authenticate with this
      ONEGW_ADMIN_PASSWORD: "change-me-admin"  # dashboard/admin API
      # ONEGW_PROVIDER_OPENROUTER_KEY: "sk-..." # upstream keys (or mount a config)
    volumes:
      - onegw-data:/data       # usage.db persists across upgrades
      # Optional: run with your own full config instead of the baked default:
      # - ./onegw.toml:/etc/onegw/onegw.toml:ro
    mem_limit: 256m            # gateway targets <=100 MB RSS
    cpus: 1

  # Optional local SearXNG for onegw's web-search provider (issue #46):
  #   docker compose --profile search up -d searxng
  # Serves the JSON API onegw calls (GET /search?q=…&format=json) on the
  # loopback only; point the provider's base_url at http://127.0.0.1:8888.
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    cpus: 1

volumes:
  onegw-data:
