# onegw on a VPS: `docker compose up -d`
services:
  onegw:
    image: ghcr.io/freepeak/onegw:latest
    # build: .                 # uncomment to build from this directory instead
    restart: unless-stopped
    ports:
      - "8080:8080"           # LAN/public; use "127.0.0.1:8080:8080" to keep it loopback-only
                              # (that limits the HOST side only — the in-container bind
                              # stays 0.0.0.0:8080, so ONEGW_KEYS below is still required)
    environment:
      # REQUIRED, and never auto-generated: the baked config binds 0.0.0.0:8080
      # and onegw refuses to start a non-loopback listener with no auth keys
      # (open-proxy guard). Compose refuses to start without a value, so a
      # placeholder that bills your upstream accounts cannot be shipped by
      # accident:
      #   ONEGW_KEYS=$(openssl rand -hex 24) docker compose up -d
      ONEGW_KEYS: "${ONEGW_KEYS:?set ONEGW_KEYS to a secret (openssl rand -hex 24)}"
      # Dashboard/admin API. Deliberately not set: first boot mints a random
      # password, prints it once as "FIRST-RUN ADMIN PASSWORD" in `docker logs`,
      # and persists it at /data/admin_password (0600) across restarts.
      # Uncomment to pin your own instead:
      # ONEGW_ADMIN_PASSWORD: "pick-a-long-one"
      # ONEGW_PROVIDER_OPENROUTER_KEY: "sk-..." # upstream keys (or mount a config)
    volumes:
      - onegw-data:/data       # usage.db persists across upgrades
      # Config: the dashboard's provider editor SAVES INTO this file (atomic temp
      # file + rename), so give it a writable DIRECTORY — a named volume is
      # initialized from the image with the right ownership and survives a
      # recreate:
      - onegw-config:/etc/onegw
      # A single-file mount does NOT work for in-page editing, for two reasons:
      # the save's temp file needs a writable DIRECTORY, and even then rename()
      # cannot replace a bind-mounted file ("device or resource busy"); :ro is
      # read-only by definition. A DIRECTORY mount does work — hand it to the
      # container's user on a Linux VPS (chown -R 100:101). Use the file form
      # only to hand-edit the config:
      # - ./onegw.toml:/etc/onegw/onegw.toml:ro
    mem_limit: 256m            # gateway targets <=100 MB RSS
    cpus: 1

  # Optional local SearXNG for onegw's web-search provider (issue #46):
  #   docker compose --profile search up -d searxng
  # Serves the JSON API onegw calls (GET /search?q=…&format=json) on the
  # loopback only; point the provider's base_url at http://127.0.0.1:8888.
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    cpus: 1

volumes:
  onegw-data:
  onegw-config:
