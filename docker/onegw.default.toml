# onegw default config baked into the container image.
# Everything secret comes from env at runtime — no keys in the image:
#   ONEGW_KEYS="key1,key2"                     gateway client keys — REQUIRED
#                                                here: this config binds
#                                                0.0.0.0:8080 below and onegw
#                                                refuses to start a non-loopback
#                                                listener with no auth keys (only
#                                                a loopback bind may run keyless)
#   ONEGW_PROVIDER_<NAME>_KEY[2..9]            upstream provider keys
#   ONEGW_ADMIN_PASSWORD                       dashboard/admin API (unset: a random
#                                                password is generated on first boot,
#                                                stored in the /data volume and printed
#                                                once in the container log)
# Subscription (device-flow) accounts are logged in from inside the container —
# the account name must match its [[providers.accounts]] entry, and the image's
# ONEGW_DATA_DIR=/data means no paths are needed:
#   docker exec -it <container> onegw oauth list
#   docker exec -it <container> onegw oauth login -provider xai -account <you>
# The dashboard's provider editor (Providers page) writes both halves of that
# wiring and offers a Sign in button, so the CLI is only needed for scripts.
#
# This file is EDITABLE from the dashboard (the provider/combos editor splices
# into it and hot-reloads), which is why the image chowns /etc/onegw to the
# container user. To keep those edits across a recreate, mount a writable
# directory there — `-v onegw-config:/etc/onegw` (a named volume is seeded from
# this file with the right ownership). A single-file mount cannot be atomically
# replaced, so in-page saves fail with "device or resource busy".

[server]
listen = "0.0.0.0:8080"        # in-container bind; publish with -p to reach it
data_dir = "/data"             # usage.db lives here (volume)
admin_password = ""            # unset + no ONEGW_ADMIN_PASSWORD: first boot
                               # generates + persists a random one (log line
                               # "FIRST-RUN ADMIN PASSWORD" in docker logs)

[saver]
enabled = true

# No providers configured: the gateway boots and serves the dashboard until
# you add providers via a mounted config or env. Define providers like:
# [[providers]]
# name = "openrouter"
# kind = "openai"
# base_url = "https://openrouter.ai/api"
# models = ["openai/gpt-5.5"]
# See onegw.toml.example for the full reference.
